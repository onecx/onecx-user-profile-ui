@if (shouldShowForm()) {
  <form [formGroup]="languageFormGroup" class="language-selector-compact px-2">
    <p-selectButton
      id="up_language_switch_language"
      styleClass="white-space-nowrap"
      formControlName="language"
      size="small"
      [allowEmpty]="false"
      [escape]="false"
      [options]="availableLanguages"
      [ariaLabel]="'LANGUAGE_SWITCH.TOOLTIP' | translate"
      [pTooltip]="'LANGUAGE_SWITCH.TOOLTIP' | translate"
      tooltipPosition="bottom"
      tooltipEvent="hover"
    >
    </p-selectButton>
  </form>
}
