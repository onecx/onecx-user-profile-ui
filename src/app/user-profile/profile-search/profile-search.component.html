<ocx-portal-page permission="USERPROFILE#SEARCH" helpArticleId="PAGE_PROFILE_SEARCH">
  <ocx-search-header
    [header]="'DIALOG.SEARCH.HEADER' | translate"
    [subheader]="'DIALOG.SEARCH.SUBHEADER' | translate"
    (searched)="onSearch()"
    (resetted)="onResetCriteria()"
    [manualBreadcrumbs]="false"
    [actions]="[]"
  >
    <div [formGroup]="criteriaGroup" class="flex flex-row flex-wrap gap-3">
      <p-floatlabel variant="on">
        <input
          id="up_user_profile_search_criteria_first_name"
          pInputText
          type="text"
          formControlName="firstName"
          class="w-11rem sm:w-15rem text-responsive"
          [ariaLabel]="'USER_PROFILE.FIRST_NAME' | translate"
          [pTooltip]="'USER_PROFILE.FIRST_NAME.TOOLTIP' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="up_user_profile_search_criteria_first_name">{{ 'USER_PROFILE.FIRST_NAME' | translate }}</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input
          id="up_user_profile_search_criteria_last_name"
          pInputText
          type="text"
          formControlName="lastName"
          class="w-11rem sm:w-15rem text-responsive"
          [ariaLabel]="'USER_PROFILE.LAST_NAME' | translate"
          [pTooltip]="'USER_PROFILE.LAST_NAME.TOOLTIP' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="up_user_profile_search_criteria_last_name">{{ 'USER_PROFILE.LAST_NAME' | translate }}</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input
          id="up_user_profile_search_criteria_email"
          pInputText
          type="text"
          formControlName="email"
          class="w-11rem sm:w-15rem text-responsive"
          [ariaLabel]="'USER_PROFILE.EMAIL' | translate"
          [pTooltip]="'USER_PROFILE.EMAIL.TOOLTIP' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="up_user_profile_search_criteria_email">{{ 'USER_PROFILE.EMAIL' | translate }}</label>
      </p-floatlabel>
      <p-floatlabel *ocxAdvanced variant="on">
        <input
          id="up_user_profile_search_criteria_user_id"
          pInputText
          type="text"
          formControlName="userId"
          class="w-12rem sm:w-15rem text-responsive"
          [ariaLabel]="'USER_PROFILE.USER_ID' | translate"
          [pTooltip]="'USER_PROFILE.USER_ID.TOOLTIP' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="up_user_profile_search_criteria_user_id">{{ 'USER_PROFILE.USER_ID' | translate }}</label>
      </p-floatlabel>
    </div>
  </ocx-search-header>

  <ocx-content class="ocx-content">
    @if (loading) {
      <p-message severity="info" [text]="'ACTIONS.GENERAL.LOADING' | translate"></p-message>
    }
    @if (exceptionKey) {
      <p-message severity="error" [text]="exceptionKey | translate"></p-message>
    } @else {
      <ocx-interactive-data-view
        id="up_search_table"
        styleClass="p-0"
        [data]="(resultData$ | async) ?? []"
        [supportedViewLayouts]="['table']"
        [layout]="layout"
        [columns]="columns"
        [defaultGroupKey]="'ACTIONS.SEARCH.PREDEFINED_GROUP.DEFAULT'"
        [clientSideFiltering]="false"
        [clientSideSorting]="true"
        [sortField]="sortField"
        [sortDirection]="sortDirection"
        (sorted)="onSorted($event)"
        [tablePaginator]="true"
        [pageSize]="20"
        [pageSizes]="[20, 60, 100]"
        [disableFilterView]="true"
        [emptyResultsMessage]="'ACTIONS.SEARCH.NO_DATA' | translate"
        [additionalActions]="additionalActions"
        actionColumnPosition="left"
        [frozenActionColumn]="true"
        (dataViewLayoutChange)="onDataViewLayoutChange($event)"
        (displayedColumnKeysChange)="onDisplayedColumnKeysChange($event)"
      >
        <ng-template #topCenter>
          <p-inputgroup class="w-auto up-filter-group">
            <p-inputgroup-addon>
              <i class="pi pi-filter"></i>
            </p-inputgroup-addon>
            <p-floatlabel class="up-filter-float" variant="on">
              <input
                #filterInput
                id="up_user_profile_search_table_filter"
                type="text"
                class="up-filter-input"
                pInputText
                [value]="tableFilter"
                [ariaLabel]="'ACTIONS.SEARCH.FILTER' | translate"
                [pTooltip]="'ACTIONS.SEARCH.FILTER' | translate"
                tooltipPosition="top"
                tooltipEvent="hover"
                (input)="onGlobalFilter(filterInput.value)"
              />
              <label for="up_user_profile_search_table_filter" aria-hidden="true">
                {{ 'ACTIONS.SEARCH.FILTER' | translate }}
              </label>
            </p-floatlabel>
            <p-button
              id="up_user_profile_search_table_filter_clear"
              icon="pi pi-filter-slash"
              styleClass="up-filter-clear"
              (onClick)="onClearGlobalFilter(filterInput)"
              [disabled]="!tableFilter"
              [ariaLabel]="'ACTIONS.SEARCH.FILTER_CLEAR' | translate"
              [pTooltip]="'ACTIONS.SEARCH.FILTER_CLEAR' | translate"
              tooltipPosition="top"
              tooltipEvent="hover"
            ></p-button>
          </p-inputgroup>
        </ng-template>
        <ng-template pTemplate="dateTableCell" let-rowObject="rowObject" let-column="column">
          <ng-container> {{ rowObject[column.id] | date: dateFormat }} </ng-container>
        </ng-template>
      </ocx-interactive-data-view>
    }
  </ocx-content>
</ocx-portal-page>

<!-- DELETE -->
<app-profile-delete
  [displayDeleteDialog]="displayDeleteDialog"
  [userProfileId]="userProfile?.id"
  [displayName]="userProfile?.person?.displayName"
  (hideDialog)="onProfileDeleteHideDialog()"
  (deleteDone)="onProfileDeleteDone()"
></app-profile-delete>

<!-- DETAIL -->
<app-personal-data-admin
  [displayPersonalDataDialog]="displayPersonalDataDialog"
  [userProfileId]="userProfile?.id"
  (hideDialog)="onCloseDetail()"
></app-personal-data-admin>
